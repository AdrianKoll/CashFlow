<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | CashFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-final.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-ui-final-aplicado.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="brand login-brand"><img class="brand-logo" src="{{ url_for('static', filename='img/cashflow-mark-purple.png') }}" alt="CashFlow"><b>CashFlow</b></div>
    <h1>Acessar sistema</h1>
    <p>Entre com seu usuário e senha cadastrados.</p>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <label>Usuário<input name="username" required autocomplete="username"></label>
    <label>Senha<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="primary">Entrar</button>
  </form>
</body>
</html>
