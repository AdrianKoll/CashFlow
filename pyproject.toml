[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cashflow"
version = "0.1.0"
description = "Aplicação web responsiva de gestão financeira para pequenos negócios, feita com Flask."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-Login>=0.6,<0.7",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Werkzeug>=3.0,<4.0",
    "reportlab>=4.0,<5.0",
    "python-dotenv>=1.0,<2.0",
    "Flask-WTF>=1.2,<2.0",
    "Flask-Limiter>=3.5,<5.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

# CashFlow é uma aplicação, não uma biblioteca: os templates e arquivos estáticos
# ficam fora do pacote `app`. Por isso `pip install .` instala apenas as
# dependências, e o código é executado direto da pasta do projeto.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
